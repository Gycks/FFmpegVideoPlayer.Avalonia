name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ["8.0.x", "10.0.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore solution
        run: dotnet restore FFmpegVideoPlayer.Avalonia.sln

      - name: Build Core
        run: dotnet build FFmpegVideoPlayer.Core/FFmpegVideoPlayer.Core.csproj -c Release --no-restore

      - name: Build Avalonia
        run: dotnet build Avalonia.FFmpegVideoPlayer.csproj -c Release --no-restore

      - name: Pack Core
        run: dotnet pack FFmpegVideoPlayer.Core/FFmpegVideoPlayer.Core.csproj -c Release --no-build --output ./artifacts

      - name: Pack Avalonia
        run: dotnet pack Avalonia.FFmpegVideoPlayer.csproj -c Release --no-build --output ./artifacts

      - name: Push to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate